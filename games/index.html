<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .game-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        #game-canvas { background: #000; display: block; margin: 0 auto; max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <i class="fas fa-gamepad text-indigo-500 text-2xl"></i>
                    <span class="text-xl font-bold tracking-tight">GAMES<span class="text-indigo-500">HUB</span></span>
                </div>
                <div class="flex-1 max-w-md mx-8 hidden md:block">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="search-input" class="block w-full bg-gray-800 border-none rounded-lg py-2 pl-10 pr-3 text-sm placeholder-gray-400 focus:ring-2 focus:ring-indigo-500" placeholder="Search games...">
                    </div>
                </div>
                <div class="flex items-center gap-4 text-sm font-medium">
                    <a href="#" class="text-gray-300 hover:text-white">Home</a>
                    <a href="#" class="text-gray-300 hover:text-white">New</a>
                    <a href="#" class="text-gray-300 hover:text-white">Popular</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-indigo-900/20 py-12 border-b border-indigo-900/30">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Unblocked & Unlimited Gaming</h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">Play the best classic games directly in your browser. No downloads, no blocks, just pure fun.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Categories -->
        <div class="flex flex-wrap gap-2 mb-8" id="category-filters">
            <button class="px-4 py-2 rounded-full bg-indigo-600 text-white text-sm font-semibold active-filter" data-category="all">All Games</button>
            <button class="px-4 py-2 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 text-sm font-semibold" data-category="arcade">Arcade</button>
            <button class="px-4 py-2 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 text-sm font-semibold" data-category="puzzle">Puzzle</button>
            <button class="px-4 py-2 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 text-sm font-semibold" data-category="classic">Classic</button>
        </div>

        <!-- Game Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6" id="game-grid">
            <!-- Games will be injected here -->
        </div>
    </main>

    <!-- Game Modal -->
    <div id="game-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
        <div class="bg-gray-900 rounded-xl overflow-hidden max-w-4xl w-full relative shadow-2xl border border-gray-800">
            <div class="flex items-center justify-between p-4 border-b border-gray-800">
                <h2 id="modal-title" class="text-xl font-bold">Game Title</h2>
                <button id="close-modal" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 flex flex-col items-center">
                <div id="game-container" class="relative w-full aspect-video flex items-center justify-center bg-black rounded-lg overflow-hidden border border-gray-800">
                    <!-- Game Canvas will be here -->
                    <canvas id="game-canvas"></canvas>

                    <div id="game-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-10">
                        <button id="start-game-btn" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full font-bold text-lg shadow-lg">PLAY NOW</button>
                    </div>
                </div>
                <div class="mt-6 w-full">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-lg font-semibold">How to Play</h3>
                        <div class="flex gap-2">
                            <span id="game-category" class="px-3 py-1 bg-gray-800 rounded text-xs uppercase tracking-wider text-gray-400">Category</span>
                        </div>
                    </div>
                    <p id="game-description" class="text-gray-400 text-sm">Use arrow keys to move and space to interact.</p>

                    <div class="mt-4 p-4 bg-gray-800/50 rounded-lg flex gap-8 items-center">
                        <div class="flex flex-col">
                            <span class="text-xs text-gray-500 uppercase font-bold">Controls</span>
                            <div id="game-controls" class="flex gap-2 mt-1">
                                <!-- Controls icons -->
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs text-gray-500 uppercase font-bold">Best Score</span>
                            <span id="best-score" class="text-xl font-mono text-indigo-400">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-8 mt-12 text-center text-gray-500 text-sm">
        <p>© 2025 GamesHub - All Games Unblocked</p>
    </footer>

    <script src="games.js"></script>
    <!-- Game Scripts will be dynamically loaded or included if they are small -->
    <script src="lib/snake.js"></script>
    <script src="lib/2048.js"></script>
    <script src="lib/tetris.js"></script>
    <script src="lib/minesweeper.js"></script>
</body>
</html>
